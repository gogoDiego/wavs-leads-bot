name: Worker

on:
  # Every 30 minutes. Public repo = unlimited free GitHub Actions minutes.
  # Each invocation lists active funnels and runs only those whose
  # interval_hours has elapsed since last_run_at — most fires are cheap no-ops.
  schedule:
    - cron: '*/30 * * * *'
  # Manual trigger button — Actions tab → "Worker" → Run workflow.
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run due funnels
        env:
          DATABASE_URL:            ${{ secrets.DATABASE_URL }}
          SLACK_BOT_TOKEN:         ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET:    ${{ secrets.SLACK_SIGNING_SECRET }}
          SLACK_LEADS_CHANNEL_ID:  ${{ secrets.SLACK_LEADS_CHANNEL_ID }}
          SLACK_ADMIN_USER_ID:     ${{ secrets.SLACK_ADMIN_USER_ID }}
          APIFY_TOKEN:             ${{ secrets.APIFY_TOKEN }}
          APIFY_TWEET_ACTOR:       ${{ vars.APIFY_TWEET_ACTOR || 'altimis/scweet' }}
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL:         ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          TZ:                      America/Chicago
          LOG_LEVEL:               info
          SLACK_SOCKET_MODE:       'false'
        run: node scripts/runDueOnce.js
